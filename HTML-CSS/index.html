<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        /* NAVBAR */

        nav {
            background: #1e3a8a;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 24px;
        }

        nav span {
            font-size: 14px;
        }

        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b7280;
        }

        /* CARD */

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            color: #1e3a8a;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #1e3a8a;
        }

        /* MARKS */

        .marks-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* BUTTON */

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d6b;
        }

        /* FOOTER */

        footer {
            text-align: center;
            background: #1e3a8a;
            color: white;
            padding: 18px;
            margin-top: 50px;
        }

        /* RESPONSIVE */

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 6px;
                text-align: center;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .marks-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }
        }

    </style>

</head>


<body>

    <!-- NAVIGATION -->

    <nav>

        <h1>Student Portal</h1>

        <span>
            Student Registration & Result Management
        </span>

    </nav>


    <!-- MAIN -->

    <main class="container">

        <div class="title">

            <h2>
                Student Registration
            </h2>

            <p>
                Enter your personal details and examination marks
            </p>

        </div>


        <!-- REGISTRATION CARD -->

        <section class="card">

            <h3>
                Student Details
            </h3>


            <form id="studentForm">

                <!-- PERSONAL DETAILS -->

                <div class="form-grid">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter student name"
                            required
                            pattern="[A-Za-z ]+"
                            title="Enter letters and spaces only"
                        >

                    </div>


                    <div class="form-group">

                        <label for="roll">
                            Roll Number
                        </label>

                        <input
                            type="text"
                            id="roll"
                            placeholder="Enter roll number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="student@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="10 digit phone number"
                            required
                            pattern="[0-9]{10}"
                        >

                    </div>


                    <div class="form-group">

                        <label for="course">
                            Select Course
                        </label>

                        <select id="course" required>

                            <option value="">
                                -- Select Course --
                            </option>

                            <option>
                                B.Tech Information Technology
                            </option>

                            <option>
                                B.Tech Computer Science
                            </option>

                            <option>
                                B.E. Computer Science
                            </option>

                            <option>
                                B.E. Electronics
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="year">
                            Year
                        </label>

                        <select id="year" required>

                            <option value="">
                                -- Select Year --
                            </option>

                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>

                        </select>

                    </div>

                </div>


                <!-- MARKS -->

                <h3 style="margin-top: 30px;">
                    Examination Marks
                </h3>


                <div class="marks-grid">

                    <div class="form-group">

                        <label for="html">
                            HTML
                        </label>

                        <input
                            type="number"
                            id="html"
                            placeholder="0 - 100"
                            min="0"
                            max="100"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="css">
                            CSS
                        </label>

                        <input
                            type="number"
                            id="css"
                            placeholder="0 - 100"
                            min="0"
                            max="100"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="javascript">
                            JavaScript
                        </label>

                        <input
                            type="number"
                            id="javascript"
                            placeholder="0 - 100"
                            min="0"
                            max="100"
                            required
                        >

                    </div>

                </div>


                <!-- BUTTON -->

                <div class="button-container">

                    <button type="submit">
                        Register & View Result
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 Student Registration & Result Portal

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        const form =
            document.getElementById("studentForm");


        form.addEventListener("submit", function(event) {

            event.preventDefault();


            /* GET STUDENT DETAILS */

            const student = {

                name:
                    document.getElementById("name").value.trim(),

                roll:
                    document.getElementById("roll").value.trim(),

                email:
                    document.getElementById("email").value.trim(),

                phone:
                    document.getElementById("phone").value.trim(),

                course:
                    document.getElementById("course").value,

                year:
                    document.getElementById("year").value,


                /* GET MARKS */

                html:
                    Number(
                        document.getElementById("html").value
                    ),

                css:
                    Number(
                        document.getElementById("css").value
                    ),

                javascript:
                    Number(
                        document.getElementById("javascript").value
                    )

            };


            /* SAVE DATA */

            sessionStorage.setItem(
                "studentData",
                JSON.stringify(student)
            );


            /* OPEN RESULT PAGE */

            window.location.href = "result.html";

        });

    </script>

</body>

</html>
